name: Deploy to Hugging Face Spaces

# Runs after CI passes on main (never on pull requests), or by hand from the
# Actions tab. Needs a repository secret HF_TOKEN: a Hugging Face token with
# write access. The Space id defaults to tingluzhang/airfrans-gnn and can be
# changed with a repository variable HF_SPACE.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      HF_SPACE: ${{ vars.HF_SPACE || 'tingluzhang/airfrans-gnn' }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install huggingface_hub==2.3.0
      - name: Assemble the Space (only what the image needs)
        run: |
          mkdir space
          cp -r Dockerfile .dockerignore pyproject.toml src serve space/
          cp serve/SPACE_README.md space/README.md
      - name: Push to the Space, which rebuilds the image
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a repository secret HF_TOKEN (Hugging Face write token) to deploy"
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(repo_id=space, repo_type="space", folder_path="space",
                            commit_message=f"Deploy {os.environ['SHA'][:7]} from GitHub",
                            delete_patterns=["src/**", "serve/**"])
          print(f"pushed to https://huggingface.co/spaces/{space}")
          PY
